<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor de bits - LID</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js for sound effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- MP3 encoder for offline exports -->
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.all.js"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Archivo CSS Externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col justify-between select-none relative overflow-x-hidden overflow-y-auto">

    <!-- Custom LID Hand Cursor -->
    <div id="lidCursor" class="lid-cursor"></div>

    <!-- Top Status Bar / Header -->
    <header id="appHeader" class="app-header w-full px-6 py-4 flex justify-between items-center z-10">
        <div class="flex items-center space-x-3">
            <!-- Botón LID MENU -->
            <button id="headerMenuButton" class="wii-pill-btn px-6 text-sm font-black tracking-wider flex items-center justify-center space-x-2 cursor-pointer shadow-md">
                <img src="assets/estilo-boton-estandar.png" class="btn-bg" alt="Fondo botón">
                <span>LID</span>
                <span class="text-xs bg-white text-blue-600 px-2.5 py-0.5 rounded-full font-bold shadow-inner">MENU</span>
            </button>
            <h1 id="appTitleHeader" class="text-gray-700 font-bold text-lg drop-shadow-sm">Traductor de bits - Audio & Imagen</h1>
        </div>
        <div class="flex items-center space-x-4">
            <div id="clockDisplay" class="bg-white/90 backdrop-blur-md px-4 py-1.5 rounded-full shadow border border-gray-200 text-gray-700 font-bold text-sm tracking-wide">
                00:00
            </div>
            <button id="infoButton" class="w-10 h-10 rounded-full bg-white/90 backdrop-blur-md shadow border border-gray-200 flex items-center justify-center text-gray-700 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-300 transition cursor-pointer" title="Información de la Web">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="appMain" class="flex-1 max-w-screen-2xl w-full mx-auto px-4 md:px-8 py-2 flex items-stretch justify-center z-10">
        <div id="scannerAppView" class="scanner-app-view flex w-full max-w-7xl flex-col bg-white/95 backdrop-blur-md text-gray-800 p-4 md:p-5 rounded-3xl shadow-2xl border-4 border-blue-400">
            <div id="scannerTitleBar" class="scanner-title-bar relative flex justify-between items-center mb-4 border-b border-gray-200 pb-3">
                <div class="flex items-center space-x-3">
                    <!-- Etiqueta AUDIO -->
                    <div class="wii-pill-btn px-5 text-white font-bold text-sm text-center shadow-md">
                        <img src="assets/estilo-boton-estandar.png" class="btn-bg" alt="Fondo botón">
                        <span>AUDIO</span>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-blue-600">Traductor de bits</h2>
                        <p class="text-gray-500 text-xs">Carga una imagen para convertirla en audio o un audio para visualizar su espectro.</p>
                    </div>
                </div>
            </div>

            <div id="scannerWorkspace" class="scanner-workspace">
                <aside id="scannerControls" class="scanner-controls">
                    <label for="imageInput" class="block text-sm font-semibold mb-2 text-gray-700">1. Cargar imagen o audio:</label>
                    <label for="imageInput" id="mediaUploadZone" class="media-upload-zone flex min-h-16 w-full min-w-0 flex-col items-center justify-center rounded-xl border-2 border-dashed border-blue-300 bg-blue-50/60 px-3 py-2 text-center text-sm text-blue-700 transition cursor-pointer hover:border-blue-500 hover:bg-blue-50">
                        <span class="text-2xl" aria-hidden="true">+</span>
                        <span class="media-file-name block w-full min-w-0 overflow-hidden text-ellipsis whitespace-nowrap font-semibold">Seleccionar archivo</span>
                        <span class="text-xs text-blue-500">Imágenes o audio MP3, WAV y OGG</span>
                    </label>
                    <input type="file" id="imageInput" accept="image/*,audio/mpeg,audio/wav,audio/ogg" class="sr-only">
                    <label class="scanner-free-mode flex cursor-pointer items-start gap-2 text-sm font-semibold text-gray-700">
                        <input id="freeModeToggle" type="checkbox" class="mt-0.5 h-4 w-4 shrink-0 accent-blue-500">
                        <span>Modo libre: mueve la barra con el cursor y mantén el clic para que suene</span>
                    </label>
                    
                    <!-- Botones Play, Stop, Descargar y Convertir -->
                    <div class="scanner-playback-controls">
                        <button id="playPauseButton" type="button" class="wii-pill-btn shadow-md transition cursor-pointer" disabled>
                            <img src="assets/estilo-boton-estandar.png" class="btn-bg" alt="Fondo botón">
                            <span>Play</span>
                        </button>
                        <button id="stopButton" type="button" class="wii-pill-btn shadow-md transition cursor-pointer" disabled>
                            <img src="assets/estilo-boton-estandar.png" class="btn-bg" alt="Fondo botón">
                            <span>Stop</span>
                        </button>
                    </div>
                    <div class="scanner-download-controls">
                        <button id="downloadButton" type="button" class="wii-pill-btn shadow-md transition cursor-pointer" disabled>
                            <img src="assets/estilo-boton-estandar.png" class="btn-bg" alt="Fondo botón">
                            <span>Descargar</span>
                        </button>
                        <button id="convertButton" type="button" class="wii-pill-btn shadow-md transition cursor-pointer" disabled>
                            <img src="assets/estilo-boton-estandar.png" class="btn-bg" alt="Fondo botón">
                            <span>Convertir</span>
                        </button>
                    </div>
                </aside>
                <div id="canvasContainer" class="canvas-container flex justify-center bg-gray-900 rounded-xl p-2 overflow-hidden border border-gray-300 relative w-full shadow-inner">
                    <div id="canvasPreviewWindow" class="flex w-full items-center justify-center overflow-hidden rounded-lg bg-black/40">
                        <canvas id="canvas" class="max-w-full h-auto rounded"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Footer -->
    <footer id="appFooter" class="app-footer relative w-full h-24 md:h-28 z-20 overflow-visible">
        <div id="footerBar" class="footer-bar absolute inset-0 bg-gradient-to-t from-gray-300 via-gray-200 to-transparent border-t-2 border-blue-400/80 shadow-[0_-10px_25px_rgba(0,0,0,0.08)] flex items-center justify-between px-6 md:px-16">
            
            <a id="footerHomeButton" href="https://www.instagram.com/lid.udp/" target="_blank" rel="noopener noreferrer" class="group relative flex items-center justify-center w-16 h-16 md:w-20 md:h-20 rounded-full bg-gradient-to-b from-white to-gray-200 border-4 border-blue-400 shadow-lg hover:scale-105 active:scale-95 transition cursor-pointer" aria-label="Instagram de LID">
                <span class="text-blue-600 font-extrabold text-lg md:text-xl tracking-tighter group-hover:text-blue-700">LID</span>
            </a>

            <div id="messageBoardButton" class="absolute left-1/2 flex -translate-x-1/2 flex-col items-center cursor-pointer">
                <div class="relative flex items-center space-x-2 bg-white/90 backdrop-blur-md px-6 py-2 rounded-full shadow-md border border-blue-200 hover:border-blue-400 transition">
                    <span class="absolute -right-2 -top-2 flex h-6 w-6 items-center justify-center rounded-full border-2 border-white bg-red-500 text-xs font-extrabold text-white shadow-md">!</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                    <span id="dateDisplay" class="text-gray-700 font-bold text-sm">...</span>
                </div>
            </div>

            <div id="footerControls" class="footer-controls flex items-center gap-3">
                <button id="startCameraButton" type="button" class="group relative flex items-center justify-center w-16 h-16 md:w-20 md:h-20 rounded-full bg-gradient-to-b from-emerald-100 to-white border-4 border-emerald-400 shadow-lg hover:scale-105 active:scale-95 transition cursor-pointer" title="Activar/Desactivar MediaPipe">
                    <span class="text-emerald-600 font-extrabold text-[10px] tracking-tight group-hover:text-emerald-700 text-center px-1">MEDIA PIPE</span>
                </button>

                <button id="settingsButton" class="group relative flex items-center justify-center w-16 h-16 md:w-20 md:h-20 rounded-full bg-gradient-to-b from-white to-gray-200 border-4 border-blue-400 shadow-lg hover:scale-105 active:scale-95 transition cursor-pointer" title="Ajustes de Sonido y Escáner">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-600 group-hover:rotate-45 transition duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756.2924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>
            </div>
        </div>
    </footer>

    <!-- Archivo JS Externo -->
    <script src="main.js"></script>
</body>
</html>
